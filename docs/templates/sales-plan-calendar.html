<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>월별 매출 목표</title>
<!--
  월별 매출 목표 달력 양식 — 날짜별 예상 매출(만원)을 지점 색으로 나눠 보여주고, B2B 납품 상세를 아래 카드로 붙인다.
  다음 달에 쓸 때는 아래 PLAN 객체만 바꾼다(달·지점 기간·평일/주말 목표·B2B 건). 나머지는 PLAN으로 그려진다.
  그림(PNG)으로 뽑기: node docs/templates/render-sales-plan.cjs  → docs/templates/sales-plan.png
  B2B 카드에는 요청자(발주 담당 마케팅팀 등)를 넣지 않는다 — 점포 담당자만.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
<style>
  :root {
    --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; --soft: #f8f8f7; --bg: #ffffff;
    --b2b: #dc2626; --b2b-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', 'WenQuanYi Zen Hei', sans-serif; }
  .page { width: 1400px; padding: 40px 44px 44px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
  h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; }
  .sub { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .lg { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
  .lg small { font-weight: 500; opacity: .85; }

  table.cal { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .cal th { background: var(--soft); font-size: 14px; font-weight: 700; color: var(--muted); padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cal th.sun { color: #dc2626; } .cal th.sat { color: #2563eb; }
  .cal th.wk { width: 130px; }
  .cal td { vertical-align: top; height: 150px; padding: 10px 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cal tr:last-child td { border-bottom: none; }
  .cal td.wk { border-right: none; background: var(--soft); vertical-align: middle; text-align: center; }
  .cal td.empty { background: repeating-linear-gradient(135deg, #fafafa 0 8px, #f3f4f6 8px 16px); }
  .day { font-size: 15px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .sun .day { color: #dc2626; } .sat .day { color: #2563eb; }
  .chip { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 7px; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .chip b { font-size: 14px; }
  .tot { margin-top: 8px; text-align: right; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .tot span, .wk-num span { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .hot { box-shadow: inset 0 0 0 3px var(--b2b); }
  .wk-label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .wk-num { font-size: 24px; font-weight: 800; margin-top: 2px; white-space: nowrap; letter-spacing: -0.5px; }

  .lower { display: grid; gap: 20px; margin-top: 24px; }
  .card { border: 1px solid #fecaca; background: #fffafa; border-radius: 14px; padding: 18px 20px; }
  .card h2 { margin: 0 0 4px; font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--b2b); color: #fff; }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 12px; font-size: 14px; }
  .meta b { color: var(--b2b); }
  table.store { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .store th { text-align: left; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .store td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .store tr:last-child td { border-bottom: none; }
  .store .q { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .store .nm, .store .ct { white-space: nowrap; }
  .store .sumrow td { font-weight: 800; background: #fff1f1; }

  .summary { margin-top: 20px; display: grid; gap: 12px; }
  .sbox { border-radius: 12px; padding: 14px 16px; }
  .sbox .k { font-size: 13px; font-weight: 700; }
  .sbox .v { font-size: 28px; font-weight: 800; margin-top: 2px; letter-spacing: -0.5px; }
  .sbox .v span { font-size: 15px; font-weight: 700; margin-left: 2px; }
  .sbox .d { font-size: 12px; margin-top: 2px; opacity: .85; }
  .sbox.total { background: var(--ink); color: #fff; }
  .foot { margin-top: 14px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 16px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="legend" id="legend"></div>
  </header>
  <table class="cal">
    <thead><tr><th class="sun">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th class="sat">토</th><th class="wk">주 합계</th></tr></thead>
    <tbody id="cal"></tbody>
  </table>
  <div class="lower" id="b2b"></div>
  <div class="summary" id="summary"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
// ─── 이 블록만 바꾼다 ─────────────────────────────────────────────────────────
const PLAN = {
  year: 2026,
  month: 11, // 1~12
  unit: '만원',
  // 지점별 하루 예상 매출(만원). 금요일은 평일로 친다. 기간이 달 밖으로 이어지면 그 달 날짜만 그린다
  stores: [
    { name: '대구 신세계 #2', short: '대구', from: '2026-11-01', to: '2026-11-05', weekday: 300, weekend: 800, color: '#d97706', bg: '#fef3c7', periodLabel: '10/23~11/5' },
    { name: '강남 신세계', short: '강남', from: '2026-11-05', to: '2026-11-12', weekday: 150, weekend: 200, color: '#2563eb', bg: '#dbeafe' },
    { name: '한화 청량리 #2', short: '청량리', from: '2026-11-13', to: '2026-12-03', weekday: 350, weekend: 600, color: '#059669', bg: '#d1fae5' },
  ],
  // 지점별 날짜 예외(휴무일 0 등) — { '2026-11-17': { '청량리': 0 } }
  overrides: {},
  // B2B 납품 — 매출은 qty × unitPrice(원). 계약 단가가 없으면 POS 정가로 넣고 priceNote에 적는다
  b2b: [
    {
      date: '2026-11-05', client: 'LG전자', product: '샤인머스켓산도', unitPrice: 8000, priceNote: '정가 기준 추정',
      pickup: '오전 7:00', arrive: '오전 9:00', prepDate: '11/4(수)',
      stores: [{ name: 'LG전자가산<br>R&D캠퍼스점', addr: '서울시 금천구<br>가산디지털1로 51', qty: 250, contact: '송승원 · 010-5672-6687' }],
    },
    {
      date: '2026-11-25', client: '아워홈', product: '후르츠산도', unitPrice: 9000, priceNote: '정가 기준 추정',
      pickup: '오전 7:30', arrive: '오전 9:00', prepDate: '11/24(화)', supplies: '각대봉투(중) 스티커 포함 240세트 (여분 포함)',
      stores: [
        { name: '엔씨R&D센터판교점', addr: '경기도 성남시 분당구 대왕판교로 644번길 12,<br>엔씨R&D센터 지하1층', qty: 208, bags: '각대봉투(중) 208', contact: '장혜령 (총괄) · 010-4104-8002' },
        { name: '엔씨알파리움판교점', addr: '위와 같은 주소', qty: 27, bags: '각대봉투(중) 27', contact: '이슬기 · 010-2799-8445' },
      ],
    },
  ],
  footLeft: '청량리 12/1~12/3: 하루 350만원씩 1,050만원 추가 → 청량리 전체 8,850만원',
  footRight: '백화점 휴무일 미반영',
};
// ─────────────────────────────────────────────────────────────────────────────

const fmt = n => (Math.round(n * 10) / 10).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
const pad = n => String(n).padStart(2, '0');
const iso = d => `${PLAN.year}-${pad(PLAN.month)}-${pad(d)}`;
const DOW = '일월화수목금토';
const b2bManwon = b => b.stores.reduce((s, x) => s + x.qty, 0) * b.unitPrice / 10000;
const b2bQty = b => b.stores.reduce((s, x) => s + x.qty, 0);
const md = s => `${Number(s.slice(5, 7))}/${Number(s.slice(8, 10))}`;

document.getElementById('title').textContent = `${PLAN.year}년 ${PLAN.month}월 매출 목표`;
document.getElementById('sub').textContent = `날짜별 예상 매출(${PLAN.unit}) · 굵은 숫자가 그날 합계 · 빨간 테두리는 B2B 납품 날`;
document.getElementById('legend').innerHTML =
  PLAN.stores.map(s => `<span class="lg" style="background:${s.bg};color:${s.color}">${s.name} <small>${s.periodLabel ?? `${md(s.from)}~${md(s.to)}`} · 평일 ${s.weekday} / 주말 ${s.weekend}</small></span>`).join('') +
  `<span class="lg" style="background:var(--b2b-bg);color:var(--b2b)">🚚 B2B 납품</span>`;

const days = new Date(PLAN.year, PLAN.month, 0).getDate();
const byDay = {}; const storeTotals = {};
for (let d = 1; d <= days; d++) {
  const date = iso(d); const dow = new Date(PLAN.year, PLAN.month - 1, d).getDay();
  const items = [];
  for (const s of PLAN.stores) {
    if (date < s.from || date > s.to) continue;
    const v = PLAN.overrides[date]?.[s.short] ?? (dow === 0 || dow === 6 ? s.weekend : s.weekday);
    if (!v) continue;
    items.push({ label: s.short, v, color: s.color, bg: s.bg });
    storeTotals[s.name] = (storeTotals[s.name] ?? 0) + v;
  }
  for (const b of PLAN.b2b) if (b.date === date) items.push({ label: `🚚 ${b.client}`, v: b2bManwon(b), b2b: true });
  byDay[d] = items;
}

const first = new Date(PLAN.year, PLAN.month - 1, 1).getDay();
const cells = [...Array(first).fill(null), ...Array.from({ length: days }, (_, i) => i + 1)];
while (cells.length % 7) cells.push(null);
let html = '';
for (let w = 0; w < cells.length / 7; w++) {
  let wk = 0, row = '';
  for (let i = 0; i < 7; i++) {
    const d = cells[w * 7 + i];
    const cls = [i === 0 ? 'sun' : '', i === 6 ? 'sat' : ''];
    if (d == null) { row += `<td class="${cls.join(' ')} empty"></td>`; continue; }
    const items = byDay[d]; const total = items.reduce((s, x) => s + x.v, 0); wk += total;
    if (items.some(x => x.b2b)) cls.push('hot');
    row += `<td class="${cls.join(' ')}"><div class="day">${d}</div>` +
      items.map(x => x.b2b
        ? `<div class="chip" style="background:var(--b2b-bg);color:var(--b2b)"><span>${x.label}</span><b>${fmt(x.v)}</b></div>`
        : `<div class="chip" style="background:${x.bg};color:${x.color}"><span>${x.label}</span><b>${fmt(x.v)}</b></div>`).join('') +
      (total ? `<div class="tot">${fmt(total)}<span>${PLAN.unit}</span></div>` : '') + '</td>';
  }
  html += `<tr>${row}<td class="wk"><div class="wk-label">${w + 1}주</div><div class="wk-num">${fmt(wk)}<span>${PLAN.unit}</span></div></td></tr>`;
}
document.getElementById('cal').innerHTML = html;

const b2bEl = document.getElementById('b2b');
b2bEl.style.gridTemplateColumns = PLAN.b2b.length > 1 ? '1fr 1.55fr' : '1fr';
b2bEl.innerHTML = PLAN.b2b.map(b => {
  const d = new Date(b.date); const hasBags = b.stores.some(s => s.bags);
  const qty = b2bQty(b);
  return `<div class="card">
    <h2><span class="tag">B2B</span> ${md(b.date)}(${DOW[d.getDay()]}) ${b.client} · ${b.product} ${qty.toLocaleString('ko-KR')}개</h2>
    <div class="meta">
      <div>픽업 <b>${b.pickup}</b></div><div>점포 도착 <b>${b.arrive}</b></div>
      ${b.supplies ? `<div>부자재 <b>${b.supplies}</b></div>` : ''}
      <div>생산 <b>${b.prepDate}</b></div>
      <div>예상 매출 <b>${fmt(b2bManwon(b))}${PLAN.unit}</b> (${b.priceNote ?? `개당 ${b.unitPrice.toLocaleString('ko-KR')}원`})</div>
    </div>
    <table class="store"><thead><tr><th>점포</th><th>위치</th><th>수량</th>${hasBags ? '<th>부자재</th>' : ''}<th>담당자</th></tr></thead><tbody>
      ${b.stores.map(s => `<tr><td class="nm"><b>${s.name}</b></td><td>${s.addr}</td><td class="q">${s.qty.toLocaleString('ko-KR')}개</td>${hasBags ? `<td>${s.bags ?? ''}</td>` : ''}<td class="ct">${s.contact.replace(' · ', '<br>')}</td></tr>`).join('')}
      ${b.stores.length > 1 ? `<tr class="sumrow"><td>합계</td><td></td><td class="q">${qty.toLocaleString('ko-KR')}개</td>${hasBags ? '<td></td>' : ''}<td></td></tr>` : ''}
    </tbody></table>
  </div>`;
}).join('');

const b2bTotal = PLAN.b2b.reduce((s, b) => s + b2bManwon(b), 0);
const grand = Object.values(storeTotals).reduce((s, v) => s + v, 0) + b2bTotal;
const sumEl = document.getElementById('summary');
sumEl.style.gridTemplateColumns = `repeat(${PLAN.stores.length + (PLAN.b2b.length ? 2 : 1)}, 1fr)`;
sumEl.innerHTML =
  PLAN.stores.map(s => {
    const inMonth = (storeTotals[s.name] ?? 0);
    const counts = { wd: 0, we: 0 };
    for (let d = 1; d <= days; d++) {
      const date = iso(d); if (date < s.from || date > s.to) continue;
      const dow = new Date(PLAN.year, PLAN.month - 1, d).getDay();
      dow === 0 || dow === 6 ? counts.we++ : counts.wd++;
    }
    const detail = [counts.wd ? `${s.weekday} × ${counts.wd}일` : '', counts.we ? `${s.weekend} × ${counts.we}일` : ''].filter(Boolean).join(' + ');
    const partial = s.to > iso(days) || s.from < iso(1) ? ` (${PLAN.month}월분)` : '';
    return `<div class="sbox" style="background:${s.bg};color:${s.color}"><div class="k">${s.name}${partial}</div><div class="v">${fmt(inMonth)}<span>${PLAN.unit}</span></div><div class="d">${detail}</div></div>`;
  }).join('') +
  (PLAN.b2b.length ? `<div class="sbox" style="background:var(--b2b-bg);color:var(--b2b)"><div class="k">B2B ${PLAN.b2b.length}건</div><div class="v">${fmt(b2bTotal)}<span>${PLAN.unit}</span></div><div class="d">${PLAN.b2b.map(b => `${b.client} ${fmt(b2bManwon(b))}`).join(' + ')}</div></div>` : '') +
  `<div class="sbox total"><div class="k">${PLAN.month}월 합계</div><div class="v">${fmt(grand)}<span>${PLAN.unit}</span></div><div class="d">B2B는 ${PLAN.b2b.some(b => b.priceNote) ? '정가 기준 추정' : '계약 단가'}</div></div>`;
document.getElementById('foot').innerHTML = `<span>${PLAN.footLeft ?? ''}</span><span>${PLAN.footRight ?? ''}</span>`;
</script>
</body>
</html>
